name: Garmin sync

on:
  schedule:
    - cron: '17 */3 * * *' # 3시간마다
  workflow_dispatch: # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      # 로그인 토큰 재사용 (매번 로그인하면 가민이 차단할 수 있음)
      - uses: actions/cache@v4
        with:
          path: ~/.garminconnect
          key: garmin-tokens-${{ github.run_id }}
          restore-keys: garmin-tokens-

      - name: Sync
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
        run: python scripts/garmin_sync.py

      - name: Commit
        run: |
          git config user.name "garmin-sync[bot]"
          git config user.email "garmin-sync@users.noreply.github.com"
          [ -f data/garmin.enc.json ] || { echo "동기화 데이터 없음"; exit 0; }
          git add data/garmin.enc.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "가민 러닝 기록 동기화"
          git pull --rebase
          git push
